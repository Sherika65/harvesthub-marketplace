<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarvestHub - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img src="images/harvesthub-logo.png" alt="HarvestHub Logo">
    </div>

    
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html" class="active">Register</a>
      <a href="products.html" id="navProducts" style="display:none;">Products</a>
      <a href="cart.html" id="navCart" style="display:none;">Cart</a>
      <a href="orders.html" id="navOrders" style="display:none;">My Orders</a>
      <a href="farmer-dashboard.html" id="navDashboard" style="display:none;">Dashboard</a>
      <a href="add-product.html" id="navAddProduct" style="display:none;">Add Product</a>
      <a href="manage-products.html" id="navManage" style="display:none;">Manage Products</a>
      <span id="navUser" style="color:#a5d6a7;"></span>
      <a href="#" id="navLogout" style="display:none;" onclick="logout(); return false;">Logout</a>
    </div>
  </nav>

  <div class="form-card">
    <h2>Create an Account</h2>
    <div id="message" class="message"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Choose a password">
      </div>
      <div class="form-group">
        <label for="role">Register as</label>
        <select id="role">
          <option value="">-- Select role --</option>
          <option value="customer">Customer (Buy products)</option>
          <option value="farmer">Farmer (Sell products)</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Register</button>
      </div>
    </form>
    <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <footer class="footer">
    <p>HarvestHub &copy; - 2026</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
