<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarvestHub - Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img src="images/harvesthub-logo.png" alt="HarvestHub Logo">
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="products.html" id="navProducts" style="display:none;" class="active">Products</a>
      <a href="cart.html" id="navCart" style="display:none;">Cart</a>
      <a href="orders.html" id="navOrders" style="display:none;">My Orders</a>
      <a href="farmer-dashboard.html" id="navDashboard" style="display:none;">Dashboard</a>
      <a href="add-product.html" id="navAddProduct" style="display:none;">Add Product</a>
      <a href="manage-products.html" id="navManage" style="display:none;">Manage Products</a>
      <span id="navUser" style="color:#a5d6a7;"></span>
      <a href="#" id="navLogout" style="display:none;" onclick="logout(); return false;">Logout</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="section-title">Fresh Products Marketplace</h2>
    <div style="display:flex; gap:10px; margin-bottom:20px; max-width:400px;">
      <input type="text" id="searchInput" placeholder="Search by name or category..." style="flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:15px;">
      <button id="searchBtn" class="btn btn-primary">Search</button>
    </div>
    <div class="grid" id="productGrid">
      <p>Loading products...</p>
    </div>
  </div>

  <footer class="footer">
    <p>HarvestHub &copy; 2026 </p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
